<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="honeyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="honeyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#0F0E0C"/>
    </linearGradient>
    <filter id="honeyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luxury Hexagonal Honeycomb Emblem Container -->
  <g transform="translate(10, 10)">
    <!-- Base Rounded Container with Gold Border -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#honeyDark)" stroke="url(#honeyGold)" stroke-width="2.5" filter="url(#honeyGlow)"/>
    
    <!-- Inner Fine Accent Ring -->
    <rect x="5" y="5" width="90" height="90" rx="19" fill="none" stroke="#FDE68A" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="3,2"/>

    <!-- Stylized Crown & Flowing Honey Hair Silhouette -->
    <g transform="translate(18, 14) scale(0.64)">
      <!-- Hexagon Accent Behind Silhouette -->
      <polygon points="50,12 82,30 82,70 50,88 18,70 18,30" fill="none" stroke="url(#honeyGold)" stroke-width="2" stroke-opacity="0.35"/>
      
      <!-- Flowing Hair Golden Curve -->
      <path d="M50 8 C72 8 88 22 88 40 C88 54 78 64 62 70 C44 76 32 84 32 96 C32 108 44 116 60 116 C76 116 88 106 90 94" 
            fill="none" stroke="url(#honeyGold)" stroke-width="7" stroke-linecap="round"/>
      
      <!-- Graceful Facial Profile -->
      <path d="M48 38 C54 44 58 50 56 58 C55 63 50 67 46 72 C44 74 46 77 50 78 C54 79 56 83 52 87 C48 91 42 93 38 98" 
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Serene Eyelash & Brow -->
      <path d="M51 52 C54 53 56 55 58 58" fill="none" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M56 54 L60 52" fill="none" stroke="#FCD34D" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Lower Flowing Hair Wave -->
      <path d="M38 98 C34 104 36 112 42 118 C52 126 70 124 82 112 C88 106 94 92 92 78" 
            fill="none" stroke="url(#honeyGold)" stroke-width="4.5" stroke-linecap="round"/>
      
      <!-- Radiant Diamond Sparkle -->
      <path d="M68 20 L70 14 L72 20 L78 22 L72 24 L70 30 L68 24 L62 22 Z" fill="#FEF3C7"/>
    </g>
  </g>

  <!-- Editorial Brand Typography for Light Backgrounds -->
  <g transform="translate(130, 26)">
    <!-- Primary Brand Wordmark 'HONEY' -->
    <text x="0" y="44" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="46" font-weight="900" fill="#1C1917" letter-spacing="3.5">
      HONEY
    </text>

    <!-- Subtitle: Beauty Salon & Spa -->
    <text x="2" y="68" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#B45309" letter-spacing="4.5">
      BEAUTY SALON &amp; SPA
    </text>

    <!-- Heritage & Dual Location Tag -->
    <text x="2" y="86" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#78716C" letter-spacing="2">
      L'ORÉAL PARTNER SALON • TRILANGA &amp; ROHIT NAGAR, BHOPAL
    </text>
  </g>
</svg>
